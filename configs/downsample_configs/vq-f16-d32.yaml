model:
  base_learning_rate: 1e-4
  target: nvg.models.downsample.VQAE
  params:
    embed_dim: 32
    n_embed: 4096
    v_patch_nums: (1, 2, 4, 8, 16, 32, 64, 128, 256)
    monitor: 'val/rec_loss'
    cnn_type: '2d'
    cnn_norm_axis: 'spatial'
    base_ch: 128
    encoder_ch_mult: [1, 2, 4, 4, 4]
    decoder_ch_mult: [1, 2, 4, 4, 4]
    num_res_blocks: 2
    downsampled_size: 16
    temporal_patch_size: 4
    gradient_accumulation_steps: 1
    gradient_clip_val: 1
    smooth_end_epoch: 1
    use_ema: True
    lossconfig:
      target: nvg.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        dino_disc: True
        disc_conditional: False
        disc_in_channels: 3
        disc_start: 0 # from 0 epoch
        disc_weight: 0.8
        gen_loss_weight: 0.1
        lecam_loss_weight: 0.001
        codebook_weight: 1.0
        commit_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    train:
      target: nvg.data.imagenet.ImageNetTrain
      params:
        config:
          size: 256
    validation:
      target: nvg.data.imagenet.ImageNetValidation
      params:
        config:
          size: 256

lightning:
  trainer:
    benchmark: False
    max_epochs: 100
    log_every_n_steps: 1
    num_nodes: 1 #2
    devices: 1 #8
    accelerator: gpu
    precision: 32